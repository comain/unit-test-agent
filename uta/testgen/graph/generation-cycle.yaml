entry: precheck_existing_tests_reconcile

edges:
  - [plan_tests_prompt, plan_tests_turn]
  - [generate_tests_prompt, generate_tests_turn]
  - [fix_compile_prompt, fix_compile_turn]
  - [fix_tests_prompt, fix_tests_turn]
  - [fix_coverage_prompt, fix_coverage_turn]
  - [fix_mutation_prompt, fix_mutation_turn]
  - [delegated_quality_gate_prompt, delegated_quality_gate_turn]
  - [review_equivalent_mutants_prompt, review_equivalent_mutants_turn]
  - [complete_generation_run, __end__]
  - [complete_generation_rehydrate, __end__]
  - [terminate_generation, __end__]

branches:
  - from: precheck_existing_tests_reconcile
    selector: reconciliation_outcome
    routes:
      run: precheck_existing_tests_run
      retry_no_effect: precheck_existing_tests_run
      reuse_result: precheck_existing_tests_rehydrate
      adopt_result: precheck_existing_tests_rehydrate
      verify_existing_edit: terminate_generation
      fail_indeterminate: terminate_generation
      fail_unsafe: terminate_generation
    default: terminate_generation
  - from: precheck_existing_tests_run
    selector: precheck_outcome
    routes:
      proceed: plan_tests_turn_reconcile
      plan_skipped: generate_tests_turn_reconcile
      existing_repair: verify_compile_reconcile
      skip_target: complete_generation_reconcile
      delegated_repair: delegated_quality_gate_verify_reconcile
      failed: complete_generation_reconcile
    default: complete_generation_reconcile
  - from: precheck_existing_tests_rehydrate
    selector: precheck_outcome
    routes:
      proceed: plan_tests_turn_reconcile
      plan_skipped: generate_tests_turn_reconcile
      existing_repair: verify_compile_reconcile
      skip_target: complete_generation_reconcile
      delegated_repair: delegated_quality_gate_verify_reconcile
      failed: complete_generation_reconcile
    default: complete_generation_reconcile
  - from: plan_tests_turn_reconcile
    selector: reconciliation_outcome
    routes:
      run: plan_tests_prompt
      retry_no_effect: plan_tests_prompt
      reuse_result: plan_tests_turn_rehydrate
      adopt_result: plan_tests_turn_rehydrate
      verify_existing_edit: terminate_generation
      fail_indeterminate: terminate_generation
      fail_unsafe: terminate_generation
    default: terminate_generation
  - from: plan_tests_turn
    selector: normalized_turn_outcome
    routes:
      continue: plan_tests_interpret_reconcile
      cancelled: pause_generation
    default: plan_tests_interpret_reconcile
  - from: plan_tests_turn_rehydrate
    selector: rehydration_outcome
    routes:
      ready: plan_tests_interpret_reconcile
    default: complete_generation_reconcile
  - from: plan_tests_interpret_reconcile
    selector: reconciliation_outcome
    routes:
      run: plan_tests_interpret
      retry_no_effect: plan_tests_interpret
      reuse_result: plan_tests_result_rehydrate
      adopt_result: plan_tests_result_rehydrate
      verify_existing_edit: terminate_generation
      fail_indeterminate: terminate_generation
      fail_unsafe: terminate_generation
    default: terminate_generation
  - from: plan_tests_interpret
    selector: plan_outcome
    routes:
      passed: generate_tests_turn_reconcile
      retry: plan_tests_turn_reconcile
      exhausted: complete_generation_reconcile
      failed: complete_generation_reconcile
    default: complete_generation_reconcile
  - from: plan_tests_result_rehydrate
    selector: plan_outcome
    routes:
      passed: generate_tests_turn_reconcile
      retry: plan_tests_turn_reconcile
      exhausted: complete_generation_reconcile
      failed: complete_generation_reconcile
    default: complete_generation_reconcile
  - from: generate_tests_turn_reconcile
    selector: reconciliation_outcome
    routes:
      run: generate_tests_prompt
      retry_no_effect: generate_tests_prompt
      reuse_result: generate_tests_turn_rehydrate
      adopt_result: generate_tests_turn_rehydrate
      verify_existing_edit: verify_compile_reconcile
      fail_indeterminate: terminate_generation
      fail_unsafe: terminate_generation
    default: terminate_generation
  - from: generate_tests_turn
    selector: normalized_turn_outcome
    routes:
      continue: generate_tests_interpret_reconcile
      cancelled: pause_generation
    default: generate_tests_interpret_reconcile
  - from: generate_tests_turn_rehydrate
    selector: rehydration_outcome
    routes:
      ready: generate_tests_interpret_reconcile
    default: complete_generation_reconcile
  - from: generate_tests_interpret_reconcile
    selector: reconciliation_outcome
    routes:
      run: generate_tests_interpret
      retry_no_effect: generate_tests_interpret
      reuse_result: generate_tests_result_rehydrate
      adopt_result: generate_tests_result_rehydrate
      verify_existing_edit: verify_compile_reconcile
      fail_indeterminate: terminate_generation
      fail_unsafe: terminate_generation
    default: terminate_generation
  - from: generate_tests_interpret
    selector: generation_outcome
    routes:
      passed: verify_compile_reconcile
      retry: generate_tests_turn_reconcile
      exhausted: complete_generation_reconcile
      failed: complete_generation_reconcile
    default: complete_generation_reconcile
  - from: generate_tests_result_rehydrate
    selector: generation_outcome
    routes:
      passed: verify_compile_reconcile
      retry: generate_tests_turn_reconcile
      exhausted: complete_generation_reconcile
      failed: complete_generation_reconcile
    default: complete_generation_reconcile
  - from: verify_compile_reconcile
    selector: reconciliation_outcome
    routes:
      run: verify_compile_run
      retry_no_effect: verify_compile_run
      reuse_result: verify_compile_rehydrate
