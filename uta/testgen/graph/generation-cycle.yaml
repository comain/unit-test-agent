# The language-neutral lifecycle inside one target-generation batch.
#
# Language backends supply the mechanics: Java compiles with Maven and measures
# mutation with PIT, while Python verifies syntax/tests with pytest and mutation
# with mutmut. A backend may report an unsupported measurement as `skipped`, but
# it must not replace this lifecycle with an agent-specific conversation loop.
#
# ## How to read this file
#
# Every phase expands to a fixed shape, so the file is long but uniform.
#
#   model-driven:   <phase>_turn_reconcile -> _prompt -> _turn -> _interpret_reconcile
#                   -> _interpret, with _turn_rehydrate / _result_rehydrate as the
#                   resume paths that must never re-enter the model
#   deterministic:  <phase>_reconcile -> _run, with _rehydrate as the resume path
#
# A reconcile node decides whether an interrupted operation should run again,
# be reused, or be treated as unsafe. Rehydrate nodes restore an existing
# envelope and never call the prompt, model or interpreter again -- that is what
# makes a resumed run cheap instead of a repeat of everything already paid for.
#
# Every branch carries a `default`. Without one, a selector returning a key
# nobody mapped is an error at build time rather than a run that stops
# somewhere unexplained.
#
# Repair routes are bounded by construction: each repair phase routes `retry`
# back to itself and `exhausted` to completion, so the attempt budget in state
# is what ends the loop, never the graph's shape.
#
# `operator_phase` is the label a person sees. Several nodes share one: the
# prompt, turn and interpret of `plan_tests` all report as `plan_tests`. Node
# mechanics are internal; the phase label set is a contract.
name: test-generation-cycle

