[program:uta_api]
directory=/opt/app/unit_test_agent
command=/opt/app/unit_test_agent/scripts/start_api_trigger.sh --foreground --no-stop
user=root
autostart=true
autorestart=true
startsecs=5
startretries=10
stopsignal=TERM
stopwaitsecs=60
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/opt/app/uta-data/runner/api_trigger_supervisor.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
environment=PYTHONUNBUFFERED="1"

